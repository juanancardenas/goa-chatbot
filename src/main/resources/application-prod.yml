spring:
  security:
    oauth2:
      jwk-uri: https://goa.miwupm.es/api/goa-user/oauth2/jwks
      token-uri: https://goa.miwupm.es/api/goa-user/oauth2/token
      api-client-id: ${API_CLIENT_ID}
      api-client-secret: ${API_CLIENT_SECRET}
  ai:
    model:
      chat: openai
    openai:
      api-key: ${CHATBOT_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
          max-output-tokens: 500
  data:
    mongodb:
      auto-index-creation: true
      uri: ${MONGODB_URI}

goa:
  user:
    base-url: https://goa.miwupm.es/api/goa-user/users
  engagement:
    base-url: https://goa.miwupm.es/api/goa-engagement

app:
  cors:
    allowed-origins: https://goa.miwupm.es

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

chatbot:
  ai:
    enabled: true
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2
    max-input-characters: 1000
    max-output-tokens: 500
    max-context-messages: 10
    timeout-seconds: 20
    documents-available: false
    base-prompt: >
      Eres un asistente conversacional integrado en GOA, una plataforma de gestión jurídica.
      Responde como un apoyo jurídico técnico, claro, prudente y cercano.
      Mantén un tono profesional, amable y fácil de leer.
      Debes sonar como un abogado que explica bien, con buena disposición y sin perder seriedad.
      Evita sonar rígido, robótico o excesivamente informal.
      En chat general, puedes orientar de forma general sin sustituir asesoría profesional real.
      En chat contextual, usa el contexto del encargo asociado cuando esté disponible.
      Si no tienes datos suficientes, dilo claramente.
      No inventes documentos, hitos, estados, fechas, tareas ni actuaciones.
      No proporciones asesoramiento legal vinculante.
      Respeta el rol del usuario y la restricción de ámbito.
      Si se pregunta por documentos y el servicio documental no está disponible, indícalo.
      No afirmes haber leído documentos reales si no hay integración documental.
      No uses tablas ni referencias a Markdown.
      Termina cada respuesta con una pregunta breve de seguimiento.
